{{- /*
Bundled S3-compatible object store: SeaweedFS in single-container mode
(master, volume server, filer and S3 gateway in one process). It replaces
MinIO, whose community edition is archived and whose images were removed from
Docker Hub in September 2026. forge creates its bucket via MakeBucket on
startup, so no pre-create step is needed.

This is the getting-started store. For production, point forge at the S3
service your organisation already runs (see docs/setup.md).
*/ -}}
{{- if .Values.seaweedfs.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-seaweedfs
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.seaweedfs.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.seaweedfs.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-seaweedfs
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  # One writer on a ReadWriteOnce volume: never run old and new pods together.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: seaweedfs
          image: {{ .Values.seaweedfs.image | quote }}
          args: ["server", "-s3", "-dir=/data"]
          env:
            # SeaweedFS takes S3 credentials from these when no -s3.config is given.
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.seaweedfs.accessKey | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.seaweedfs.secretKey | quote }}
          ports:
            - containerPort: 8333
              name: s3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8333
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
          {{- with .Values.seaweedfs.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          {{- if .Values.seaweedfs.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-seaweedfs
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-seaweedfs
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 8333
      targetPort: 8333
      name: s3
