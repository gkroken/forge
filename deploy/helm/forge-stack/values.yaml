# forge-stack: complete on-premises forge deployment.
#
# Quick start (recommended release name is forge-stack):
#
#   helm dependency update deploy/helm/forge-stack
#   helm install forge-stack deploy/helm/forge-stack \
#     --set postgresql.auth.postgresPassword=<strong-password> \
#     --set seaweedfs.secretKey=<strong-password> \
#     --set forge.extraEnv.POSTGRES_DSN="postgres://postgres:<pg-password>@forge-stack-postgresql:5432/forge?sslmode=disable" \
#     --set forge.extraEnv.S3_SECRET_KEY=<same strong-password>
#
# Service names are {release}-postgresql and {release}-seaweedfs, so with
# another release name update forge.extraEnv (POSTGRES_DSN, S3_ENDPOINT) and
# forge.waitFor to match.

# ── images ─────────────────────────────────────────────────────────────────────
# Every image comes from forge's registry, ghcr.io/gkroken: forge's own, and the
# third-party ones mirrored there under their upstream paths — copied by digest
# (not rebuilt), scanned and signed in forge's CI (deploy/third-party-images.txt).
# For an air-gapped install, copy them under the same paths into your registry
# and set global.imageRegistry to it.
global:
  imageRegistry: ""
#
# IMPORTANT: the default passwords below are for local testing only.
# Always override them before exposing forge to a network.

# ── forge ──────────────────────────────────────────────────────────────────────
forge:
  storage:
    type: external

  # Credentials wired to postgresql and the bundled SeaweedFS below.
  # If you change postgresql.auth.postgresPassword or seaweedfs.secretKey
  # you MUST update the corresponding values here to match.
  extraEnv:
    POSTGRES_DSN: "postgres://postgres:changeme-db@forge-stack-postgresql:5432/forge?sslmode=disable"
    S3_ENDPOINT:  "forge-stack-seaweedfs:8333"
    S3_BUCKET:    "forge-blobs"
    S3_ACCESS_KEY: "forge"
    S3_SECRET_KEY: "changeme-s3"
    S3_USE_SSL:   "false"

  # Default to 1 replica for the bundled on-prem install.
  # Scale up after verifying Postgres + S3 are HA themselves.
  replicaCount: 1

  # Wait for PostgreSQL and the S3 store to accept connections before forge starts.
  # Without this, forge exits immediately (no retry logic) and enters
  # CrashLoopBackOff, which can push a cold install past the Helm --wait timeout.
  waitFor:
    - {name: postgresql, host: forge-stack-postgresql, port: 5432}
    - {name: s3, host: forge-stack-seaweedfs, port: 8333}

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── postgresql ─────────────────────────────────────────────────────────────────
# Bundled metadata store (templates/postgresql.yaml): the official postgres
# image. For production prefer a managed Postgres or an operator such as
# CloudNativePG, and point forge.extraEnv.POSTGRES_DSN at it.
postgresql:
  image:
    registry: ghcr.io/gkroken
    repository: library/postgres
    tag: "18.6"
    digest: "sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336"
  auth:
    postgresPassword: "changeme-db"   # ← CHANGE THIS (and forge.extraEnv.POSTGRES_DSN)
    database: "forge"
  persistence:
    size: 8Gi
    storageClassName: ""     # "" = the cluster's default StorageClass
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# ── seaweedfs ───────────────────────────────────────────────────────────────────
# Bundled S3-compatible store (templates/seaweedfs.yaml), a getting-started
# convenience: production should point forge at its own S3 service.
# MinIO was used until its community images were removed from Docker Hub
# (2026-09).
seaweedfs:
  image:
    registry: ghcr.io/gkroken
    repository: chrislusf/seaweedfs
    tag: "4.48"
    digest: "sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d"
  accessKey: "forge"
  secretKey: "changeme-s3"   # ← CHANGE THIS (and forge.extraEnv.S3_SECRET_KEY)
  persistence:
    enabled: true
    size: 20Gi
    storageClassName: ""     # "" = the cluster's default StorageClass
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
