apiVersion: v2
name: forge-stack
description: >
  Complete forge deployment for on-premises Kubernetes. Bundles forge,
  PostgreSQL (meta store), and SeaweedFS (S3-compatible blob store) — no
  external services required beyond a Kubernetes cluster.
type: application
version: 0.3.0
appVersion: "0.1.0"
keywords:
  - artifact-repository
  - on-premises
maintainers:
  - name: forge maintainers

dependencies:
  # Local forge chart — run `helm dependency update` to package it.
  - name: forge
    version: "0.1.0"
    repository: "file://../forge"

  # PostgreSQL and the S3 store (SeaweedFS) are built-in templates
  # (templates/postgresql.yaml, templates/seaweedfs.yaml), not sub-charts: the
  # Bitnami charts could only float on :latest once Bitnami removed its
  # versioned tags, and MinIO's images were removed from Docker Hub (2026-09).
  # Their images are pinned by digest and mirrored to ghcr.io/gkroken.
