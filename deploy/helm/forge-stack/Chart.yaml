apiVersion: v2
name: forge-stack
description: >
  Complete forge deployment for on-premises Kubernetes. Bundles forge,
  PostgreSQL (meta store), and SeaweedFS (S3-compatible blob store) — no
  external services required beyond a Kubernetes cluster.
type: application
version: 0.2.0
appVersion: "0.1.0"
keywords:
  - artifact-repository
  - on-premises
maintainers:
  - name: forge maintainers

dependencies:
  # Local forge chart — run `helm dependency update` to package it.
  - name: forge
    version: "0.1.0"
    repository: "file://../forge"

  # Bitnami PostgreSQL — schema migrations run automatically on forge startup.
  # Uses chart >=18.0.0 which pins tag: latest (all versioned Bitnami tags were
  # removed from Docker Hub; only :latest survives).
  - name: postgresql
    version: ">=18.0.0 <19.0.0"
    repository: "https://charts.bitnami.com/bitnami"

  # The S3 store is a built-in template (templates/seaweedfs.yaml) running
  # SeaweedFS, pinned by digest. MinIO was used until its community images were
  # removed from Docker Hub (2026-09); Bitnami's minio sub-chart was dropped
  # earlier when Bitnami removed its versioned tags.
