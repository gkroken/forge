{{- if .Values.config.content }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "forge.fullname" . }}-config
  labels:
    {{- include "forge.labels" . | nindent 4 }}
data:
  {{ include "forge.configFileName" . }}: |
    {{- if kindIs "string" .Values.config.content }}
    {{- .Values.config.content | nindent 4 }}
    {{- else }}
    {{- .Values.config.content | toYaml | nindent 4 }}
    {{- end }}
{{- end }}
