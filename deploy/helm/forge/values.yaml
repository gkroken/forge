# Default values for forge.
# This is a YAML-formatted file. Declare variables to be passed into templates.

replicaCount: 1

# Every image the chart deploys comes from forge's registry (ghcr.io/gkroken):
# forge's own image, and third-party images mirrored there under their
# upstream paths, scanned and signed (deploy/third-party-images.txt). Set
# global.imageRegistry to pull them all from your own mirror instead — copy
# them under the same paths. "" = each image's own registry below.
global:
  imageRegistry: ""

image:
  registry: ghcr.io/gkroken
  repository: forge
  pullPolicy: IfNotPresent
  # Defaults to .Chart.AppVersion when empty.
  tag: ""
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

# waitFor holds forge back until each dependency accepts TCP connections —
# forge exits if Postgres or S3 is unreachable at startup. forge-stack sets it.
#   waitFor: [{name: postgresql, host: forge-stack-postgresql, port: 5432}]
waitFor: []
waitImage:
  registry: ghcr.io/gkroken
  repository: library/busybox
  tag: "1.36"
  digest: "sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662"

# initContainers are added verbatim after the waitFor ones.
initContainers: []

podSecurityContext:
  fsGroup: 65532

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: forge.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Storage backend. Two modes:
#   fs      — filesystem via a PVC (eval / single-node, replicaCount must be 1)
#   external — S3 blobs + Postgres meta; configure via extraEnv (production HA)
storage:
  type: fs
  fs:
    size: 10Gi
    storageClassName: ""  # leave empty for the cluster default

# Extra environment variables injected into the forge container.
# Used to configure S3 and Postgres when storage.type=external.
# Example:
#   POSTGRES_DSN: "postgres://forge:secret@pg:5432/forge?sslmode=require"
#   S3_ENDPOINT:  "https://s3.amazonaws.com"
#   S3_BUCKET:    "forge-artifacts"
#   S3_ACCESS_KEY: "..."
#   S3_SECRET_KEY: "..."  # prefer a Secret ref (see extraEnvFrom)
extraEnv: {}

# Env vars sourced from existing Secrets or ConfigMaps.
extraEnvFrom: []
# - secretRef:
#     name: forge-s3-credentials

# drain-timeout passed to forge -drain-timeout (must match terminationGracePeriodSeconds - 5s)
drainTimeout: "30s"

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /healthz
    port: http
  failureThreshold: 30
  periodSeconds: 2

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  # Note: autoscaling requires storage.type=external (PVC is RWO; FS cannot scale horizontally)

podDisruptionBudget:
  enabled: false
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}

# Prometheus metrics
metrics:
  serviceMonitor:
    # Set to true when the Prometheus Operator CRD is installed.
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Namespace to create the ServiceMonitor in (defaults to Release.Namespace).
    namespace: ""
    # Extra labels added to the ServiceMonitor — use to match your Prometheus
    # Operator's serviceMonitorSelector, e.g. { release: kube-prometheus-stack }.
    labels: {}
    relabelings: []
    metricRelabelings: []
    namespaceSelector: {}

# Declarative configuration (config-as-code). Two mutually exclusive options:
#   content         — the config itself; forge renders a ConfigMap and mounts it.
#                     Two accepted shapes:
#                       * a MAP (recommended) — author native YAML right here; it
#                         is rendered to forge.config.yaml.
#                       * a STRING — legacy inline JSON, rendered to
#                         forge.config.json. Still supported unchanged.
#   existingConfigMap — name of an existing ConfigMap holding the config; forge
#                       mounts it directly (no rendered CM). The key defaults to
#                       "forge.config.json"; override with existingConfigMapKey,
#                       e.g. "forge.config.yaml" to supply YAML.
# forge selects its parser from the file extension, so the key name is the format.
# When either option is set, forge starts with -config and the hardcoded seed
# repos are skipped. A checksum annotation on the Pod ensures Argo/Flux roll the
# Deployment when the content changes.
# Secrets must NOT be inlined here — inject them via ${ENV_VAR} placeholders and
# set actual values through extraEnv or extraEnvFrom.
#
# Example (map form):
#   config:
#     content:
#       prune: true
#       repositories:
#         - name: maven-central
#           format: maven
#           kind: proxy
#           upstream: https://repo1.maven.org/maven2
config:
  # null (not "") so a user-supplied map merges; Helm's coalesce discards a table
  # when the chart default for the same key is a scalar.
  content: null
  existingConfigMap: ""
  existingConfigMapKey: ""

# Grafana dashboard auto-import via grafana-sidecar
grafana:
  dashboard:
    # Set to true when the Grafana sidecar (k8s-sidecar) is deployed.
    # Creates a ConfigMap labelled grafana_dashboard=1 that the sidecar picks up.
    # The dashboard can also be imported manually from
    # deploy/helm/forge/dashboards/forge-overview.json.
    enabled: false
    # Extra labels on the ConfigMap, e.g. to set a Grafana folder:
    #   grafana_folder: "forge"
    labels: {}
    annotations: {}
