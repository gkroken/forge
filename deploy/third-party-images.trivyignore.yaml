secrets:
  - id: private-key
    paths: [/etc/ssl/private/ssl-cert-snakeoil.key]  # secrets: absolute path
    statement: >-
      postgres image: Debian's ssl-cert snakeoil key, generated at image build
      and so public to anyone who pulls the image. Unused: postgres runs with
      ssl=off (the image default; forge-stack does not enable it). Never point
      ssl_key_file at it — mount a real key if TLS is wanted.
    expired_at: 2027-01-08
