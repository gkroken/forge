# Exceptions to forge's image policy (HIGH/CRITICAL with a fix = fail) for
# the third-party images in third-party-images.txt. The mirror-images CI job
# passes this to Trivy.
#
# Rules for an entry:
#   - scoped by `paths` to the one binary it was found in, so the same CVE
#     turning up anywhere else still fails the gate;
#   - a statement saying why it is not reachable, or why the risk is accepted;
#   - an expired_at. When it passes, the entry stops applying and the gate goes
#     red again: bump the image, or re-justify and extend deliberately.
#     Unreachable: up to 90 days. Accepted reachable risk: up to 30 days.
#
# Remove entries when the image is bumped past them; a stale entry is harmless
# but hides nothing, so keep the file short.
vulnerabilities:
  - id: CVE-2025-68121
    paths: [usr/local/bin/gosu]
    statement: >-
      postgres image: gosu (Go 1.24.6) runs once in the entrypoint to drop root
      and exec postgres; it serves no network and parses no untrusted input.
    expired_at: 2027-01-08
